name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(bash .github/scripts/release-version.sh "$RELEASE_TAG")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Verify release
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release-version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish to Maven Central
    needs: [version, build]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Build and test publication
        run: ./gradlew --no-daemon clean build :lib:generatePomFileForMavenPublication "-PreleaseVersion=$RELEASE_VERSION"
      - name: Verify publication artifacts
        run: bash .github/scripts/verify-artifacts.sh "$RELEASE_VERSION"
      - name: Sign and publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          for credential in \
            ORG_GRADLE_PROJECT_mavenCentralUsername \
            ORG_GRADLE_PROJECT_mavenCentralPassword \
            ORG_GRADLE_PROJECT_signingInMemoryKey \
            ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [[ -z "${!credential}" ]]; then
              printf 'Missing publishing credential: %s. See devdocs/RELEASING.md.\n' "$credential" >&2
              exit 1
            fi
          done
          ./gradlew --no-daemon --no-configuration-cache :lib:publishToMavenCentral "-PreleaseVersion=$RELEASE_VERSION"
